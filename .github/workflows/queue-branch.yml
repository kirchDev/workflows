# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub — identical in every repo that groups its drains, except that this
# one calls the body by local path. The trigger lives here because the event
# does: `branches:` names this repo's integration branch, and the body reads the
# PR's base rather than a second copy of that name.
name: Queue Branch

on:
  pull_request:
    branches:
      - dev
    # `opened` only. A retarget is what this workflow DOES, so reacting to
    # `edited` would have it answer its own edit; and a push to an already
    # grouped PR needs nothing from here.
    types: [opened]

jobs:
  queue-branch:
    name: Queue Branch
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_queue-branch.yml
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
