# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Coverage Report (reusable)

# One sticky comment and one check run, built from reports a previous job
# uploaded — via the estate's own `kirchDev/coverage-report`, which reads Vitest
# and Pest output alike and sends no coverage data anywhere.
#
# THIS REPLACES FIVE IMPLEMENTATIONS across eight repos: codecov-action,
# vitest-coverage-report-action (in two versions), irongut/CodeCoverageSummary
# and a hand-built sticky-pull-request-comment. Being stack-agnostic is what
# makes it possible — it is also what removes the hardest stack-specific piece
# from a shared `ci.yml`.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      artifact:
        description: Name of the artifact holding the coverage report(s).
        required: false
        type: string
        default: coverage
      reports:
        description: >-
          Newline-separated report paths, e.g. "coverage/lcov.info" for Vitest
          or "coverage.xml" for Pest. Both may be listed.
        required: true
        type: string
      min-patch:
        description: Minimum patch coverage in percent; empty disables the check.
        required: false
        type: string
        default: ''

jobs:
  report:
    name: Coverage
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # The sticky comment and the check run.
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The reports come from whichever job produced them — this body never
      # runs a test suite itself, so it stays free of every stack it serves.
      - name: Download the coverage reports
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}

      - uses: kirchDev/coverage-report@v0.1.0
        with:
          reports: ${{ inputs.reports }}
          min-patch: ${{ inputs.min-patch }}

  # THE ONE CHECK BRANCH PROTECTION NAMES. `Coverage` is stable today, and
  # this body runs exactly one job — but that is a fact about today, not a
  # contract. The moment a second job appears here, a rule naming the first
  # silently stops covering the second.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [report]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
