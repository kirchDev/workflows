# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI Rust (reusable)

# Reusable body for a Rust crate: toolchain, cached build, fmt, clippy, tests,
# and the supply-chain gate. Taken from TitusKirch/glimpse, the estate's Tauri
# app, and generalised at the three points that were repo-local — where the
# manifest lives, which platforms matter, and which system libraries the crate
# links against.
#
# WRITTEN AHEAD OF A SECOND CALLER, deliberately. One instance is normally not a
# pattern here, but the alternative is worse: the next Rust repo would start by
# copying a 3-OS matrix with an apt list in it, and that copy would be wrong
# within a release. Migrating glimpse onto this is allowed to break its check
# names — that migration happens once, alongside every other repo's.
#
# `cargo fmt --check` may ALSO run through the gate script, as it does in
# glimpse (`"check": "… && pnpm cargofmt"`). That is not duplication worth
# removing: the gate catches it in seconds on one runner, this catches it on
# every platform in the matrix.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory holding Cargo.toml.
        required: false
        type: string
        default: .
      platforms:
        description: >-
          JSON array of runners to build on. A library needs one; anything
          shipping a binary wants all three.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      system-dependencies:
        description: >-
          apt packages to install on Linux runners before building — the
          libraries the crate links against. Empty for a crate that links none.
        required: false
        type: string
        default: ''
      components:
        description: Rust toolchain components.
        required: false
        type: string
        default: rustfmt, clippy
      cargo-deny:
        description: >-
          Run the supply-chain gate. Left as an input rather than derived from a
          deny.toml, because the file may sit anywhere and its absence is a
          policy choice rather than a fact about the repo.
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: Per-platform timeout — a cold Rust build is slow.
        required: false
        type: number
        default: 30

# THE GROUP CARRIES THIS BODY'S NAME, and that is not decoration. In a called
# workflow `github.workflow` is the CALLER's name, so two bodies invoked by the
# same caller would share one group and cancel each other — the second to start
# would kill the first, silently, and the run would report a job that never ran.
concurrency:
  group: ${{ github.workflow }}-ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Separate from the build matrix on purpose: the gate reads Cargo.lock and
  # needs no toolchain, so it answers in seconds and does not wait behind three
  # platform builds. Security advisories, licence policy and the crate-source
  # allowlist all come from deny.toml.
  deny:
    name: Cargo deny
    if: inputs.cargo-deny
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          command: check

  build:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      # One platform failing must not cancel the others — knowing that only
      # Windows breaks is the reason for running a matrix at all.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      # Linux only: macOS and Windows runners carry what a crate normally links
      # against, while a Linux image is minimal by design.
      - name: Install system dependencies
        if: runner.os == 'Linux' && inputs.system-dependencies != ''
        working-directory: ${{ github.workspace }}
        env:
          SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
        run: |
          sudo apt-get update
          # Word splitting is intended — the input is a package LIST — but the
          # value reaches the shell as a variable rather than as script text.
          # shellcheck disable=SC2086
          sudo apt-get install -y $SYSTEM_DEPENDENCIES

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: ${{ inputs.components }}

      # Keyed on the workspace so a crate in a subdirectory caches correctly;
      # a cold Rust build is minutes, a warm one seconds.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: Format check
        run: cargo fmt --all --check

      # `-D warnings` makes clippy a gate rather than advice. Without it the job
      # stays green while the lint output scrolls past unread.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  # THE ONE CHECK BRANCH PROTECTION NAMES. `Rust (ubuntu-latest)` carries
  # the platform in its name, so a rule naming it waits forever the day the
  # matrix moves — silently, and on the next pull request rather than the
  # one that changed it.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [deny, build]
    # `!cancelled()` RATHER THAN `always()`, and the difference is not cosmetic.
    # Under `always()` this job still runs while concurrency is cancelling the run
    # around it, sees `cancelled` in the results and reports a FAILURE — turning a
    # superseded run, which GitHub reports neutrally, into a red required check.
    # This way the gate is cancelled with the run it belongs to, and the run that
    # superseded it reports under the same name. A job cancelled on its own (a
    # timeout, say) still fails the gate, which is correct.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
