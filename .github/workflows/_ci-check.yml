# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI Check (reusable)

# Reusable body for the Node repos whose CI is a set of independent checks.
# The caller carries the `pull_request` trigger. See README → CI for the stub.
#
# ONE JOB, ONE STEP PER TASK — not one step running them all, and not one job
# per task either.
#
# Collapsing everything into `pnpm check` would cost the run overview: a red
# build stops saying WHICH check failed. Each task therefore gets its own
# `::group::` and its own error line.
#
# Fanning the tasks out over a MATRIX was the other candidate, and loses here on
# arithmetic. Jobs share nothing — separate runner, separate filesystem,
# separate `node_modules` — so n jobs mean n checkouts and n installs. For these
# repos a whole run takes one to two minutes and is mostly setup, so starting
# four runners to parallelise four ten-second tasks makes the run slower and
# burns four runners instead of one. The matrix earns its overhead where a
# single task runs for minutes (the Laravel and Go bodies) and where one aspect
# should be a required check on its own. Not here.
#
# THE TASK LIST IS DERIVED FROM THE GATE SCRIPT, not configured. Every repo
# already declares its checks in `package.json`, in order:
#
#   meta            "check": "pnpm lint && pnpm format && pnpm typecheck && pnpm validate"
#   this repo       "check": "pnpm lint && pnpm format && pnpm typecheck && pnpm check:policy"
#   skills          "verify": "pnpm check && pnpm skills:check && pnpm typecheck && pnpm test"
#
# `resolve` splits that script into its `pnpm <task>` calls and runs them one by
# one. So the repo-specific ones — `validate`, `check:policy`, `skills:check` —
# come along without anyone listing them here, and adding a check stays a
# `package.json` edit that CI picks up with no workflow change.
#
# A fixed candidate list would have quietly dropped exactly those.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      gate-script:
        description: >-
          The package.json script whose `&&`-chained pnpm calls become the
          checks. A repo whose `.tituskirch-skills.json` names a different
          `verify` passes that script's name here.
        required: false
        type: string
        default: check
      fallback-tasks:
        description: >-
          JSON array used only when the gate script does not exist — a repo that
          has no aggregate script still gets its conventional checks.
        required: false
        type: string
        default: '["lint", "format", "typecheck", "test"]'
      node-version:
        description: Node version to run the checks under.
        required: false
        type: string
        default: '24'
      setup-php:
        description: >-
          Install PHP and Composer before the checks run. A Laravel repo's gate
          runs Pint through `php vendor/bin/pint`, which needs both — and the
          runner image ships neither the right version nor the vendor tree.
          Same input as `_ci-e2e.yml` and `_ci-lighthouse.yml` already carry.
        required: false
        type: boolean
        default: false
      php-version:
        description: PHP version when `setup-php` is set.
        required: false
        type: string
        default: '8.4'
      setup-java:
        description: >-
          Install a JDK before the checks run, with Gradle's wrapper and
          dependency caches restored. For a repo whose gate chains a Gradle build
          — the runner image's preinstalled JDK is neither pinned nor the one the
          build's toolchain asks for. Same input as `_ci-e2e.yml` and
          `_ci-lighthouse.yml` carry.
        required: false
        type: boolean
        default: false
      java-version:
        description: Java version when `setup-java` is set.
        required: false
        type: string
        default: '25'
      java-distribution:
        description: JDK distribution when `setup-java` is set, as `actions/setup-java` names it.
        required: false
        type: string
        default: temurin
      install:
        description: Dependency install command.
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      remote-source-cache-command:
        description: >-
          Command that decides whether, and under which key, the checks' remote
          source downloads are cached. It runs after the install and must append
          `cacheable`, `key` and a multi-line `paths` to `$GITHUB_OUTPUT` itself
          (for duxt, `node ./bin/duxt-cache-key.mjs --github >> "$GITHUB_OUTPUT"`).
          Empty, the default, is off: no step runs and nothing is cached. A set
          command IS the opt-in, so there is no separate switch to keep in step.
        required: false
        type: string
        default: ''

# THE GROUP CARRIES THIS BODY'S NAME, and that is not decoration. In a called
# workflow `github.workflow` is the CALLER's name, so two bodies invoked by the
# same caller would share one group and cancel each other — the second to start
# would kill the first, silently, and the run would report a job that never ran.
concurrency:
  group: ${{ github.workflow }}-ci-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Format
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    # A draft PR is explicitly "not ready" — the queue workflows read it the
    # same way, and CI running on one would gate nothing.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Set up PHP
        if: inputs.setup-php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: inputs.setup-php
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # `cache: gradle` RATHER THAN `gradle/actions/setup-gradle`: first-party, no
      # extra SHA pin, and the same idiom as `cache: pnpm` above. It keys on the
      # build files and the wrapper properties, restores the wrapper distribution
      # and dependency caches here and saves them in its post step — so a re-run
      # of the same pull request downloads neither. This gate runs on
      # `pull_request` alone, so nothing here warms a DIFFERENT pull request.
      #
      # TOOLCHAINS ARE NOT CACHED, deliberately. With the JDK the toolchain asks
      # for installed here, Gradle resolves it locally and provisions nothing.
      - name: Set up Java
        if: inputs.setup-java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install }}
        run: bash -c "$INSTALL_COMMAND"

      # THE BODY KNOWS THE OUTPUT CONTRACT, NOT THE TOOL. Whether a download is
      # safe to cache is the caller's command's call: an Actions cache written on
      # a branch is readable by every pull request against it, so a command that
      # sees a private or authenticated source answers `cacheable=false` and the
      # cache step below skips. `false` is an answer, not a failure.
      #
      # AN INPUT AND NOT A JOB BESIDE THE CALL. A reusable workflow runs on its
      # own runner with its own filesystem, so a restore in the caller's job can
      # never reach the directory these checks read.
      - name: Resolve the remote-source cache key
        id: remote-sources
        if: inputs.remote-source-cache-command != ''
        env:
          REMOTE_SOURCE_CACHE_COMMAND: ${{ inputs.remote-source-cache-command }}
        run: bash -c "$REMOTE_SOURCE_CACHE_COMMAND"

      # Restores here and saves in its post step, once the checks have filled the
      # paths — and only on a green job, so a half-downloaded tree is never kept.
      #
      # EXACT KEY, NO `restore-keys`. A near miss would restore sources for a
      # different ref and hand the checks content that is not what the repo
      # declares. This gate runs on `pull_request` alone, so what it saves serves
      # that pull request's re-runs; a hit across pull requests comes from the
      # default branch's own writer, which has to run the identical command so
      # key and path list match.
      - name: Cache the remote sources
        if: steps.remote-sources.outputs.cacheable == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.remote-sources.outputs.paths }}
          key: ${{ steps.remote-sources.outputs.key }}

      - name: Resolve the checks
        id: resolve
        env:
          GATE_SCRIPT: ${{ inputs.gate-script }}
          FALLBACK: ${{ inputs.fallback-tasks }}
        run: |
          set -euo pipefail

          tasks=$(node -e '
            const fs = require("fs");
            const scripts = JSON.parse(fs.readFileSync("package.json", "utf8")).scripts ?? {};
            const gate = scripts[process.env.GATE_SCRIPT];

            // Split a script on `&&` and keep each `pnpm <task>` it calls. A
            // task that takes arguments is left alone — it is not a bare script
            // and running it standalone would change what it does.
            const calls = (script) =>
              script
                .split("&&")
                .map((part) => part.trim().match(/^pnpm (?:run )?([A-Za-z0-9_:.-]+)$/))
                .filter(Boolean)
                .map((m) => m[1]);

            // RESOLVED RECURSIVELY, because a gate may chain another aggregate:
            // `skills` runs `verify`, which calls `check`, which is itself
            // `lint && format`. Stopping at the first level would collapse two
            // checks into one line. `seen` guards a self-reference.
            const seen = new Set();
            const expand = (task) => {
              if (seen.has(task)) return [];
              seen.add(task);
              const body = scripts[task];
              const inner = body ? calls(body) : [];
              return inner.length ? inner.flatMap(expand) : [task];
            };

            const fromGate = gate ? calls(gate).flatMap(expand) : [];

            // Fall back only when the gate script is absent — an existing gate
            // that yields nothing parseable is a real problem, not a default.
            const tasks = gate
              ? fromGate
              : JSON.parse(process.env.FALLBACK).filter((t) => t in scripts);

            console.log([...new Set(tasks)].join(" "));
          ')

          if [ -z "$tasks" ]; then
            echo "::error::No checks resolved. Either package.json has no '"'"'$GATE_SCRIPT'"'"' script and none of the fallback tasks, or the gate chains commands this cannot split."
            exit 1
          fi

          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Resolved checks: $tasks"

      # Each task in its own log group with its own error line, so a red build
      # names the check that failed without anyone opening the log.
      - name: Run the checks
        env:
          TASKS: ${{ steps.resolve.outputs.tasks }}
        run: |
          set -uo pipefail

          for task in $TASKS; do
            echo "::group::$task"
            if pnpm "$task"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$task failed."
              exit 1
            fi
          done

  # THE ONE CHECK BRANCH PROTECTION NAMES. `Lint & Format` is stable today,
  # and this body runs exactly one job — but that is a fact about today, not
  # a contract. The moment a second job appears here, a rule naming the
  # first silently stops covering the second.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [check]
    # `!cancelled()` RATHER THAN `always()`, and the difference is not cosmetic.
    # Under `always()` this job still runs while concurrency is cancelling the run
    # around it, sees `cancelled` in the results and reports a FAILURE — turning a
    # superseded run, which GitHub reports neutrally, into a red required check.
    # This way the gate is cancelled with the run it belongs to, and the run that
    # superseded it reports under the same name. A job cancelled on its own (a
    # timeout, say) still fails the gate, which is correct.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
