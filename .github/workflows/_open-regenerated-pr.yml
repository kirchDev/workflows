# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Open a PR for a Regenerated File (reusable)

# Regenerate something, and open a pull request only if it actually changed.
#
# FOUR REPOS SOLVE THIS, IN THREE DIFFERENT WAYS, AND A FOURTH GAVE UP — measured
# across the estate: `app` twice through `peter-evans/create-pull-request`,
# `TitusKirch/TitusKirch` and `meta` each by hand through the Git and Contents
# APIs, and `gildstone` disabled its attempt entirely. That is not four copies of
# a file; it is four answers to one rule.
#
# THE RULE IS BRANCH PROTECTION, and it is why none of them could simply commit:
#
#   1. `main` and `dev` require SIGNED commits, and `git commit` in a runner signs
#      nothing. A commit written through the API is signed by GitHub itself, which
#      is what `sign-commits: true` asks for.
#   2. A push authenticated with GITHUB_TOKEN triggers NO workflows, so the pull
#      request would arrive with no CI having run on it. Hence the App token.
#
# The generator stays with the repo — Playwright, poppler-utils, a Laravel boot,
# a README renderer — and reaches in as `build-command`, the same shape
# `_ci-e2e.yml` and `_ci-lighthouse.yml` already use. What is centralised is the
# tail: did anything change, mint a token, open or update the pull request.
on:
  workflow_call:
    inputs:
      build-command:
        description: >-
          Command that regenerates the files. Runs after the standard Node
          install; anything further the generator needs belongs in `setup-command`.
        required: true
        type: string
      paths:
        description: >-
          Newline-separated paths the generator writes. Both the change detection
          and the pull request are scoped to exactly these — a generator that
          dirties anything else does not drag it along.
        required: true
        type: string
      changed-command:
        description: >-
          Decides whether anything really changed, writing `true` or `false` to
          `$GITHUB_OUTPUT` as `changed`. Empty uses a plain `git diff` over
          `paths`, which is right for a text artifact — and wrong for at least
          one binary one: `app`'s CV renders a footer in a system font, and the
          runner's build of DejaVu Sans differs from a developer's in sixteen
          bytes of its `head` table. Identical outlines, different file, a pull
          request every single run. That repo compares the RENDERED pages
          instead, and that knowledge belongs to it rather than here.
        required: false
        type: string
        default: ''
      branch:
        description: Branch the pull request is opened from.
        required: true
        type: string
      title:
        description: >-
          Pull request title, also used as the commit message. `fix:` rather than
          `chore:` where the artifact ships — only feat and fix cut a release, and
          a chore would leave the deployed file stale until something unrelated
          triggered one.
        required: true
        type: string
      body:
        description: Pull request body.
        required: false
        type: string
        default: ''
      assignees:
        description: >-
          Comma-separated logins to assign. A `changed-command` may override this
          per run by writing an `assignee` output — `meta` leaves a sync PR
          unassigned when only stars, push dates and release URLs moved, and
          assigns a human when something beyond those did. That judgement is
          about the data, so it belongs to the repo that knows the data.
        required: false
        type: string
        default: ''
      setup-command:
        description: Extra setup before the build — apt packages, Playwright browsers, a PHP boot.
        required: false
        type: string
        default: ''
      setup-php:
        description: Install PHP and Composer before the build.
        required: false
        type: boolean
        default: false
      php-version:
        description: PHP version when `setup-php` is set.
        required: false
        type: string
        default: '8.4'
      node-version:
        description: Node version.
        required: false
        type: string
        default: '24'
      install:
        description: Dependency install command.
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      app-id:
        description: >-
          GitHub App the pull request is opened as, for kirchDev and TitusKirch
          (the key is that owner's Release App PEM). Ignored for sirargonNet and
          kirch-ostendorf, which always open it as the Kirch & Ostendorf Release
          App — the only app their RELEASE_APP_PRIVATE_KEY fits.
        required: false
        type: string
        default: ''
      runner:
        description: Runner label for this body's job.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      # Both optional, but one of them must be set once there is a PR to open —
      # the resolve step fails with an error naming which one.
      BWS_ACCESS_TOKEN:
        description: Bitwarden Secrets Manager access token — opens the App PEM.
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: >-
          The Release App's PEM, for owners whose CI has no Bitwarden access.
          When set, Bitwarden is skipped.
        required: false

concurrency:
  group: ${{ github.workflow }}-open-regenerated-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Rebuild and open a PR on change
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Set up PHP
        if: inputs.setup-php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: inputs.setup-php
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Prepare
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
          # A generator that regenerates from live data needs to ask for it —
          # `TitusKirch/TitusKirch`'s README renderer queries the API once per
          # project it lists. This is the CALLER's own automatic token, so it
          # carries exactly the permissions that caller granted, and nothing more.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -c "$SETUP_COMMAND"

      - name: Rebuild
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          # A generator that regenerates from live data needs to ask for it —
          # `TitusKirch/TitusKirch`'s README renderer queries the API once per
          # project it lists. This is the CALLER's own automatic token, so it
          # carries exactly the permissions that caller granted, and nothing more.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -c "$BUILD_COMMAND"

      # Scoped to the declared paths, so a generator that also touches a lockfile
      # or a cache directory does not turn every run into a pull request.
      - name: Check for changes
        id: diff
        if: inputs.changed-command == ''
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s\n' "$PATHS" | sed '/^$/d')

          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The generated files already match their sources."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "${files[@]}"
          fi

      - name: Check for changes (repo's own answer)
        id: diff-custom
        if: inputs.changed-command != ''
        env:
          CHANGED_COMMAND: ${{ inputs.changed-command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -c "$CHANGED_COMMAND"

      # Only when there is a pull request to open — a repo whose artifact is
      # current never touches Bitwarden at all.
      #
      # DERIVED, not configured: each owner authenticates against its own `-ci`
      # mirror, so the vault id follows `github.repository_owner`, exactly as the
      # queue and release bodies do it.
      #
      # Same owner table as _release-please.yml: sirargonNet and kirch-ostendorf
      # open the PR as the Kirch & Ostendorf Release App and pass its PEM as
      # RELEASE_APP_PRIVATE_KEY, having no Bitwarden in CI (ADR-0011, ADR-0012).
      - name: Resolve the App for this owner
        id: app
        if: steps.diff.outputs.changed == 'true' || steps.diff-custom.outputs.changed == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          APP_ID: ${{ inputs.app-id }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
          HAS_BWS: ${{ secrets.BWS_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          client_id=''
          pem_id=''
          case "$OWNER" in
            sirargonNet | kirch-ostendorf)
              client_id='Iv23limtBZRLTqgEo3hn'
              if [ -n "$APP_ID" ]; then
                echo "::warning::app-id is ignored for $OWNER — the PR is opened as the Kirch & Ostendorf Release App."
              fi
              ;;
            *)
              if [ -z "$APP_ID" ]; then
                echo "::error::$OWNER must pass the app-id input."
                exit 1
              fi
              # The action accepts an app id where it asks for a client id.
              client_id=$APP_ID
              if [ "$OWNER" = 'kirchDev' ]; then
                pem_id='3a3459f0-c986-4ff3-a36b-b4550012d41e'
              else
                pem_id='29f8317d-29f7-46af-834b-b4550012d477'
              fi
              ;;
          esac

          if [ "$HAS_KEY" = 'true' ]; then
            source='secret'
          elif [ -z "$pem_id" ]; then
            echo "::error::$OWNER has no Release App PEM in Bitwarden — pass it as the RELEASE_APP_PRIVATE_KEY secret."
            exit 1
          elif [ "$HAS_BWS" != 'true' ]; then
            echo "::error::Neither RELEASE_APP_PRIVATE_KEY nor BWS_ACCESS_TOKEN is set (or one is empty) — the App key cannot be read."
            exit 1
          else
            source='bitwarden'
          fi

          echo "client-id=$client_id" >> "$GITHUB_OUTPUT"
          echo "pem-id=$pem_id" >> "$GITHUB_OUTPUT"
          echo "key-source=$source" >> "$GITHUB_OUTPUT"

      - name: Fetch App PEM from Bitwarden
        if: steps.app.outputs.key-source == 'bitwarden'
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ steps.app.outputs.pem-id }} > RELEASE_APP_PEM

      - name: Mint the App token
        id: app-token
        if: steps.diff.outputs.changed == 'true' || steps.diff-custom.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.app.outputs.client-id }}
          private-key: ${{ steps.app.outputs.key-source == 'secret' && secrets.RELEASE_APP_PRIVATE_KEY || env.RELEASE_APP_PEM }}

      # `sign-commits: true` is the whole reason this is not a `git push`: the
      # action writes the commit through the API, and GitHub signs it server-side.
      # Both protected branches reject an unsigned one, so a pushed commit would
      # produce a pull request that can never be merged.
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true' || steps.diff-custom.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: ${{ inputs.branch }}
          base: ${{ github.ref_name }}
          add-paths: ${{ inputs.paths }}
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          body: ${{ inputs.body }}
          assignees: ${{ steps.diff-custom.outputs.assignee || inputs.assignees }}

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.diff.outputs.changed || steps.diff-custom.outputs.changed }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
        run: |
          {
            if [ "$CHANGED" = "true" ]; then
              echo "## Regenerated"
              echo ""
              echo "The generated files drifted from their sources — a pull request is open on \`$BRANCH\`."
              echo ""
              echo "> $TITLE"
            else
              echo "## Up to date"
              echo ""
              echo "The generated files already match their sources."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
