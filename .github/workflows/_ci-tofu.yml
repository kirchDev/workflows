# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI OpenTofu (reusable)

# Reusable body for OpenTofu configuration: fmt, validate, lint and scan.
#
# ONE REPO USES THIS TODAY (`infrastructure`), so it is written as a body rather
# than left in place for one reason: `infrastructure` is where the estate's own
# SSOT lives, and a second repo touching Tofu should not start by copying 350
# lines. A body with one caller is a bet; a copy with two is a certainty.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory holding the Tofu configuration.
        required: false
        type: string
        default: tofu
      tofu-version:
        description: OpenTofu version.
        required: false
        type: string
        default: latest
      tflint:
        description: >-
          Run tflint over the configuration. An input rather than a fact read
          from the repo, because the absence of a `.tflint.hcl` means "use the
          defaults", not "do not lint".
        required: false
        type: boolean
        default: true
      trivy:
        description: Run the trivy misconfiguration scan over the configuration.
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: Severities that fail the scan.
        required: false
        type: string
        default: HIGH,CRITICAL

# THE GROUP CARRIES THIS BODY'S NAME, and that is not decoration. In a called
# workflow `github.workflow` is the CALLER's name, so two bodies invoked by the
# same caller would share one group and cancel each other — the second to start
# would kill the first, silently, and the run would report a job that never ran.
concurrency:
  group: ${{ github.workflow }}-ci-tofu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tofu:
    name: OpenTofu
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false

      - name: Format check
        run: tofu fmt -check -recursive

      # `init -backend=false` because validation needs the providers but must
      # not touch remote state — a CI run has no business reading it.
      - name: Init (no backend)
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      # tflint and trivy are the generic half of a Tofu gate — the part every
      # configuration repo wants and the part the next one would otherwise
      # copy. What stays with the repo is the half that touches reality: a plan
      # against real state needs real credentials and a real backend, and the
      # pull-request comment that renders it is 250 lines only one repo needs.
      #
      # THE PROVIDER REPOS NEVER REACH THIS BODY — they call `_ci-go.yml`, and
      # their only `.tf` files sit under `examples/` as documentation snippets.
      # Scanning those would report missing encryption on a toy example, which
      # is noise rather than coverage.
      - name: Set up tflint
        if: inputs.tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: tflint
        if: inputs.tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

      # `scan-ref` is the configuration directory rather than the repo root, so
      # a Dockerfile or a workflow elsewhere in the tree is not swept in here.
      - name: trivy misconfiguration scan
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'

  # THE ONE CHECK BRANCH PROTECTION NAMES. `OpenTofu` is stable today, and
  # this body runs exactly one job — but that is a fact about today, not a
  # contract. The moment a second job appears here, a rule naming the first
  # silently stops covering the second.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [tofu]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
