# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodeQL (reusable)

# Reusable body. The caller carries the triggers — including its own
# `branches:` and any `paths:` filter — and names the languages to scan.
# See README → CodeQL for the stub.
#
# The 15 copies this replaces differed in almost nothing but their action pins:
# `v4`, `v4.37.3`, `v4.37.4`, `v4.37.8`, `v4.37.9` and a raw SHA were all in
# circulation for the same two steps. A body has one pin.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      languages:
        description: >-
          JSON array of CodeQL languages to scan, e.g. '["actions","javascript-typescript"]'.
          Add "go" for a Go repo — the build mode is handled per language below.
        required: false
        type: string
        default: '["actions", "javascript-typescript"]'
      timeout-minutes:
        description: Per-language analysis timeout.
        required: false
        type: number
        default: 20

# THE GROUP CARRIES THIS BODY'S NAME, and that is not decoration. In a called
# workflow `github.workflow` is the CALLER's name, so two bodies invoked by the
# same caller would share one group and cancel each other — the second to start
# would kill the first, silently, and the run would report a job that never ran.
concurrency:
  group: ${{ github.workflow }}-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # THE BUILD MODE IS PER LANGUAGE, not shared, and that is a CodeQL
      # constraint rather than a preference: Go rejects `none` outright ("Go does
      # not support the none build mode") and has to be built. Deriving it from
      # the matrix value keeps a Go repo on the same body as everyone else —
      # in the copies this replaces, adding Go meant forking the whole file.
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: '/language:${{ matrix.language }}'

  # THE ONE CHECK BRANCH PROTECTION NAMES. `Analyze (go)` carries the
  # language in its name, so a rule naming it waits forever the day the
  # `languages` input changes — silently, and on the next pull request
  # rather than the one that changed it.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [analyze]
    # `!cancelled()` RATHER THAN `always()`, and the difference is not cosmetic.
    # Under `always()` this job still runs while concurrency is cancelling the run
    # around it, sees `cancelled` in the results and reports a FAILURE — turning a
    # superseded run, which GitHub reports neutrally, into a red required check.
    # This way the gate is cancelled with the run it belongs to, and the run that
    # superseded it reports under the same name. A job cancelled on its own (a
    # timeout, say) still fails the gate, which is correct.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
