# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub. The trigger names this repo's release branch; a repo that
# publishes an artifact adds its own job gated on `release-created`.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_release-please.yml
    with:
      # This repo's tags ARE its interface — every caller pins one, and `@v0`
      # has to keep meaning "the newest v0.x.y".
      major-alias: true
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
