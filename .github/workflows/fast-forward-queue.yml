# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub — identical in every repo that lands queue branches, except that
# this one calls the body by local path. The triggers live here because a
# reusable workflow cannot be dispatched: `workflow_call` is its only trigger,
# so the human gate provably stays in the repo it protects (ADR-0008).
name: Fast-forward Queue

on:
  # A queue branch was pushed. The App opens its PR if none is open yet; nothing
  # lands on this trigger, because a fresh push has no CI behind it and no
  # approval that could still be current. `push` runs THIS FILE from the pushed
  # branch — which is cut from the integration branch and so carries it — while
  # the body it calls always comes from the pinned ref.
  push:
    branches:
      - 'ai/queue-**'
  # An approval arrived. This is the ONE automatic landing trigger, and it fires
  # only from the DEFAULT branch's copy of this file.
  #
  # THE APPROVAL MUST COME LAST — that is a condition, not a style preference.
  # An approval is only counted while its `commit_id` is still the head, so any
  # push after it un-approves the PR; and nothing fires when CI goes green on an
  # already-approved PR. `check_suite: completed` was meant to cover exactly that
  # case and cannot: GitHub does not fire it "if the check suite was created by
  # GitHub Actions", which is every suite this repo produces. Approve after CI is
  # green, or land it with `workflow_dispatch`. See the ADR-0010 amendment in kirchDev/infrastructure.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Queue PR number to land; empty considers every open queue PR'
        required: false
        type: string

jobs:
  fast-forward-queue:
    name: Fast-forward Queue
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: ./.github/workflows/_fast-forward-queue.yml
    with:
      # Empty on every trigger but `workflow_dispatch`, which is what the body
      # expects: no input means "consider every open queue PR".
      pr: ${{ inputs.pr }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
