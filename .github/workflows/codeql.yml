# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub. The triggers live here because the branch filter is this repo's
# own — a Go repo additionally names "go" in `languages`.
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: ./.github/workflows/_codeql.yml
