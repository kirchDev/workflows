# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A repo that adds a compiled language names it in `languages` — the body sets
# the build mode per language, so Go needs no second workflow.
name: CodeQL

on:
  # PUSH ON THE RELEASE BRANCH ONLY. A push to an integration branch always has
  # a pull request open on it, and that PR run scans the same tree — listing
  # `dev` here as well ran CodeQL twice for one result, about a minute of runner
  # time per change with nothing to show for the second.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    # `ready_for_review` matters because the push trigger no longer covers `dev`:
    # a pull request opened as a draft runs the analysis once, and without this
    # type undrafting produces no second run — leaving a required code-scanning
    # result that never arrives.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: ./.github/workflows/_codeql.yml
