# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI Laravel (reusable)

# Reusable body for the Laravel packages: Pest across a PHP × Laravel matrix,
# a PostgreSQL run, coverage with a gate, and Pint. The caller carries the
# trigger. See README → CI for the stub.
#
# THE MATRIX IS THE ONE THING THIS CANNOT DERIVE. Which PHP and Laravel versions
# a package supports is a decision recorded in its composer.json constraints,
# not a fact readable from the repo — so it is an input, and the only one that
# describes what to run rather than whether to run it.
#
# A MATRIX HERE, unlike in `_ci-check.yml`, earns its overhead: each cell runs
# for minutes, they are genuinely independent, and `test` deserves to be a
# required check separate from `lint`.
on:
  workflow_call:
    inputs:
      heavy-runner:
        description: >-
          Runner for the jobs that actually use the machine, where `runner`
          sizes the light ones. Empty falls back to `runner`, so a caller that
          does not care states nothing. `app` sizes its Lighthouse shards at
          four vCPU and its planning job at two, which is what this exists for.
        required: false
        type: string
        default: ''
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      php-versions:
        description: JSON array of PHP versions, e.g. '["8.4", "8.5"]'.
        required: true
        type: string
      laravel-versions:
        description: JSON array of Laravel constraints, e.g. '["13.*"]'.
        required: true
        type: string
      illuminate-packages:
        description: >-
          JSON array of illuminate/* packages to pin to the matrix's Laravel
          version. Defaults to the set a typical package depends on.
        required: false
        type: string
        default: '["auth", "contracts", "database", "events", "support"]'
      coverage-php:
        description: PHP version the coverage run uses.
        required: false
        type: string
        default: '8.4'
      min-coverage:
        description: Coverage gate in percent — the run fails below it.
        required: false
        type: number
        default: 90
      pcov-directory:
        description: Directory PCOV instruments.
        required: false
        type: string
        default: src
      postgres-database:
        description: Database name for the PostgreSQL run.
        required: false
        type: string
        default: testing
      extensions:
        description: PHP extensions for the SQLite runs.
        required: false
        type: string
        default: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite
      static-analysis-script:
        description: >-
          The composer script running the static analyser. Empty skips the job —
          for a package that genuinely has none, not as a way to silence it.
        required: false
        type: string
        default: larastan

# THE GROUP CARRIES THIS BODY'S NAME, and that is not decoration. In a called
# workflow `github.workflow` is the CALLER's name, so two bodies invoked by the
# same caller would share one group and cancel each other — the second to start
# would kill the first, silently, and the run would report a job that never ran.
concurrency:
  group: ${{ github.workflow }}-ci-laravel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pest (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ${{ inputs.heavy-runner || inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One red cell must not cancel the others — knowing that only PHP 8.5
      # fails is the reason for running a matrix at all.
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        laravel: ${{ fromJSON(inputs.laravel-versions) }}
        # `lowest` catches a dependency the package uses but under-constrains —
        # a bug that only ever appears in someone else's install.
        dependencies: [highest, lowest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Pin Laravel version
        env:
          PACKAGES: ${{ inputs.illuminate-packages }}
          LARAVEL: ${{ matrix.laravel }}
        run: |
          set -euo pipefail
          # Only the illuminate/* packages the composer.json actually requires
          # are pinned — requiring one it does not depend on would add it.
          args=$(node -e '
            const fs = require("fs");
            const req = JSON.parse(fs.readFileSync("composer.json", "utf8")).require ?? {};
            const wanted = JSON.parse(process.env.PACKAGES);
            const v = process.env.LARAVEL;
            console.log(
              wanted
                .map((p) => `illuminate/${p}`)
                .filter((p) => p in req)
                .map((p) => `"${p}:${v}"`)
                .join(" ")
            );
          ')

          if [ -z "$args" ]; then
            echo "::warning::composer.json requires none of the named illuminate/* packages — nothing pinned."
            exit 0
          fi

          eval "composer require $args --no-update --no-interaction"

      - name: Install Composer dependencies
        env:
          LOWEST: ${{ matrix.dependencies == 'lowest' }}
        run: |
          if [ "$LOWEST" = "true" ]; then
            composer update --prefer-dist --no-progress --prefer-lowest --prefer-stable
          else
            composer update --prefer-dist --no-progress
          fi

      - name: Run Pest
        run: composer test

  test-pgsql:
    name: Pest (PostgreSQL)
    runs-on: ${{ inputs.heavy-runner || inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read

    # The SQLite matrix above would not catch a query PostgreSQL rejects, and
    # that is where these packages actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ inputs.postgres-database }}
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ inputs.postgres-database }}
      DB_USERNAME: testing
      DB_PASSWORD: testing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.coverage-php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-pgsql-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-pgsql-

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run Pest
        run: composer test

  coverage:
    name: Coverage (PCOV)
    runs-on: ${{ inputs.heavy-runner || inputs.runner }}
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      pull-requests: write
    outputs:
      report: coverage.xml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.coverage-php }}
          extensions: ${{ inputs.extensions }}, pcov
          coverage: pcov
          ini-values: pcov.directory=${{ inputs.pcov-directory }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-coverage-

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress

      # Cobertura rather than clover, because that is what the estate's own
      # coverage-report action reads. The `--min` gate fails the run here;
      # reporting it to the PR is `_coverage.yml`'s job.
      - name: Run Pest with coverage
        env:
          MIN_COVERAGE: ${{ inputs.min-coverage }}
        run: vendor/bin/pest --coverage --coverage-cobertura=coverage.xml --min="$MIN_COVERAGE"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura
          path: coverage.xml
          retention-days: 1

  # A separate job rather than a step in `test`: it needs no matrix, no database
  # and no coverage driver, so it answers in seconds instead of waiting behind
  # them — and it is the check most likely to be required on its own.
  static-analysis:
    name: Larastan
    if: inputs.static-analysis-script != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.coverage-php }}
          extensions: ${{ inputs.extensions }}
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-analysis-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-analysis-

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress

      # Fails loudly when the script is missing rather than passing on nothing:
      # a green static-analysis check that analysed nothing is worse than none.
      - name: Static analysis
        env:
          SCRIPT: ${{ inputs.static-analysis-script }}
        run: composer "$SCRIPT"

  lint:
    name: Pint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.coverage-php }}
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  # THE ONE CHECK BRANCH PROTECTION NAMES. `Pest (PHP 8.4, Laravel 13.*,
  # highest)` carries three matrix values in its name, so a rule naming it
  # waits forever the day any of them moves — silently, and on the next pull
  # request rather than the one that changed it.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [test, test-pgsql, coverage, static-analysis, lint]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
