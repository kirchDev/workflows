# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The checks come from this repo's own `check` script in package.json — adding
# one there is enough, no workflow change needed.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    # A change that touches only prose cannot break a lint, a typecheck or the
    # policy parity script. Workflows are NOT excluded: they are this repo's
    # product, and `pnpm lint:actions` is part of the gate.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: ./.github/workflows/_ci-check.yml
