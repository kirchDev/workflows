# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub. The gate itself is `package.json`'s `check` script — this file
# only says when to run it.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/_ci-check.yml
