# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The checks come from this repo's own `check` script in package.json — adding
# one there is enough, no workflow change needed.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

# NO `paths-ignore`, AND THAT IS THE POINT OF THE GATE. A change touching only
# prose cannot break a lint — but a workflow that does not TRIGGER reports no
# check at all, and a required check that never reports does not pass the merge,
# it blocks it forever. `CI / Gate` is meant to be a required check, so this
# workflow has to run on every pull request, including a README-only one.
#
# Measured trade: a docs-only pull request now costs one gate run, roughly a
# minute, where it used to cost nothing. The alternative is a rule that
# deadlocks exactly the pull requests it has no reason to stop — which three
# repos in the estate carried, unnoticed, until this was measured. Should that
# minute ever matter, the answer is skipping INSIDE the body while the gate
# still reports, never a filter on the trigger.

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: ./.github/workflows/_ci-check.yml
