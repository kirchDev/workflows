# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI Node (reusable)

# Reusable body for the Node libraries: typecheck, test and build as separate
# jobs. Sits alongside `_ci-check.yml` rather than replacing it — that one runs
# the lint/format gate, this one the work that takes minutes.
#
# SEPARATE JOBS HERE, unlike in `_ci-check.yml`, because these are the tasks
# worth paying a runner for: a test suite and a build run long enough that
# parallelism wins over the duplicated install, and `test` deserves to be a
# required check on its own.
#
# Each job is skipped when the repo has no such script — derived from
# package.json, not switched by an input.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for this body's jobs. THE ONE THING A BODY CANNOT DERIVE:
          nothing in a repository states which fleet it belongs to, and the three
          repos that run on Blacksmith chose that deliberately rather than
          inheriting it. Default keeps every other caller on GitHub-hosted.
        required: false
        type: string
        default: ubuntu-latest
      node-versions:
        description: JSON array of Node versions to test across.
        required: false
        type: string
        default: '["24"]'
      coverage-artifact:
        description: >-
          Artifact name for the coverage report `test` produces, for
          `_coverage.yml` to pick up. Empty uploads nothing.
        required: false
        type: string
        default: coverage
      coverage-path:
        description: Path the test run writes its coverage report to.
        required: false
        type: string
        default: coverage/

# THE GROUP CARRIES THIS BODY'S NAME, and that is not decoration. In a called
# workflow `github.workflow` is the CALLER's name, so two bodies invoked by the
# same caller would share one group and cancel each other — the second to start
# would kill the first, silently, and the run would report a job that never ran.
concurrency:
  group: ${{ github.workflow }}-ci-node-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve the jobs
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      typecheck: ${{ steps.has.outputs.typecheck }}
      test: ${{ steps.has.outputs.test }}
      build: ${{ steps.has.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Which scripts does this repo have?
        id: has
        run: |
          set -euo pipefail
          for task in typecheck test build; do
            if node -e "process.exit(('$task' in (JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts ?? {})) ? 0 : 1)"; then
              echo "$task=true" >> "$GITHUB_OUTPUT"
            else
              echo "$task=false" >> "$GITHUB_OUTPUT"
            fi
          done

  typecheck:
    name: Typecheck (Node ${{ matrix.node }})
    needs: resolve
    if: needs.resolve.outputs.typecheck == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    needs: resolve
    if: needs.resolve.outputs.test == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Only the first matrix entry uploads: the report is the same work done on
      # several runtimes, and a second upload under the same name would collide.
      - name: Upload the coverage report
        if: inputs.coverage-artifact != '' && matrix.node == fromJSON(inputs.node-versions)[0]
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.coverage-path }}
          retention-days: 1
          if-no-files-found: ignore

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # THE ONE CHECK BRANCH PROTECTION NAMES. `Test (Node 24)` carries the
  # matrix value in its name, so a rule naming it waits forever the day the
  # Node version moves — silently, and on the next pull request rather than
  # the one that changed it.
  #
  # This job's name never changes, so the required check is `<caller-job> / Gate`
  # — a name the CALLING repo already owns, since it chose the caller job's name.
  # Adding, renaming or removing a job in this body therefore never touches a
  # branch-protection rule again. Same rule as everywhere else here: what a
  # caller would otherwise have to maintain by hand is a copy, and copies drift.
  #
  # `if: always()` is what makes it a check rather than a report. A skipped job
  # reports nothing at all, and a required check that never reports does not fail
  # the merge — it blocks it forever. This one always runs and always answers,
  # which also settles the open question of whether `skipped` satisfies a
  # required check: nothing here relies on the answer.
  gate:
    name: Gate
    needs: [resolve, typecheck, test, build]
    # `!cancelled()` RATHER THAN `always()`, and the difference is not cosmetic.
    # Under `always()` this job still runs while concurrency is cancelling the run
    # around it, sees `cancelled` in the results and reports a FAILURE — turning a
    # superseded run, which GitHub reports neutrally, into a red required check.
    # This way the gate is cancelled with the run it belongs to, and the run that
    # superseded it reports under the same name. A job cancelled on its own (a
    # timeout, say) still fails the gate, which is correct.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    permissions: {}
    steps:
      # `skipped` PASSES, deliberately. This body skips what the repo has no
      # script for, and skips everything on a draft pull request — a draft
      # cannot be merged, and a check a repo never runs is not a check it
      # failed. `cancelled` and `failure` both fail, so a cancelled run cannot
      # be mistaken for a green one.
      - name: Every job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A job in this reusable workflow ended as '$result'."
                exit 1
                ;;
            esac
          done
